name: Sync TrainingPeaks to Intervals.icu

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: Preview changes without writing to Intervals.icu
        type: boolean
        required: false
        default: true
  schedule:
    # GitHub cron is UTC. 02:00 UTC == 05:00 Israel daylight time (summer).
    # GitHub may start scheduled jobs late; a run landing at 05–07 local is fine.
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: trainingpeaks-intervals-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build runtime image
        run: docker build --tag tp-intervals-syncer:run .

      - name: Sync calendar
        env:
          TP_INTERVALS_SYNC_CONFIG: ${{ secrets.TP_INTERVALS_SYNC_CONFIG }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dryRun || false }}
        shell: bash
        run: |
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          docker run --rm --shm-size=2g \
            -e TP_INTERVALS_SYNC_CONFIG \
            tp-intervals-syncer:run "${args[@]}"
