name: Sync TrainingPeaks to Intervals.icu

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: Preview changes without writing to Intervals.icu
        type: boolean
        required: false
        default: true
  schedule:
    # GitHub cron is UTC. Two daily triggers cover Israel standard (UTC+2) and
    # daylight (UTC+3) time; the job below runs whichever one currently maps to
    # 05:00 Asia/Jerusalem and skips the other. Actual start may be delayed by
    # GitHub — that's fine, the decision keys off the cron identity, not the clock.
    - cron: "0 2 * * *"
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: trainingpeaks-intervals-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether this trigger maps to 05:00 Asia/Jerusalem
        id: schedule
        shell: bash
        run: |
          # Manual runs always proceed.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pick the cron that equals 05:00 local for the CURRENT season, based on
          # Israel's UTC offset right now. This is independent of when GitHub
          # actually starts the job, so a delayed run is never dropped.
          offset="$(TZ=Asia/Jerusalem date +%z)"   # +0300 in summer (IDT), +0200 in winter (IST)
          if [[ "$offset" == "+0300" ]]; then
            want="0 2 * * *"   # 02:00 UTC == 05:00 IDT
          else
            want="0 3 * * *"   # 03:00 UTC == 05:00 IST
          fi
          if [[ "${{ github.event.schedule }}" == "$want" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping cron '${{ github.event.schedule }}'; season offset $offset wants '$want'."
          fi

      - name: Checkout
        if: steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v5

      - name: Build runtime image
        if: steps.schedule.outputs.run == 'true'
        run: docker build --tag tp-intervals-syncer:run .

      - name: Sync calendar
        if: steps.schedule.outputs.run == 'true'
        env:
          TP_INTERVALS_SYNC_CONFIG: ${{ secrets.TP_INTERVALS_SYNC_CONFIG }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dryRun || false }}
        shell: bash
        run: |
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          docker run --rm --shm-size=2g \
            -e TP_INTERVALS_SYNC_CONFIG \
            tp-intervals-syncer:run "${args[@]}"
